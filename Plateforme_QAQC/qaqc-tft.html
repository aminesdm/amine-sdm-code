<title>QA/QC TFT Sud Offsite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre de navigation collante + vues (tableau de bord / registre / fiche / nouveau RFI), une colonne sur téléphone */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#e9eef0; --line:#d3dbde; --ink:#13232b; --ink-2:#4b5d65; --ink-3:#7a8b92;
  --brand:#0f3d4c; --brand-ink:#ffffff; --accent:#e8a317; --accent-ink:#2b1d00;
  --ok:#1d7a4a; --ok-bg:#e1f2e8; --warn:#9a6400; --warn-bg:#fbefd2; --bad:#b3261e; --bad-bg:#fbe3e1; --info:#1f5f8b; --info-bg:#e0edf6; --mute-bg:#eceff1;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --surface:#14232a; --surface-2:#1b2e36; --line:#2a414b; --ink:#e4ecef; --ink-2:#a9bbc2; --ink-3:#7c9099;
  --brand:#7cc4d8; --brand-ink:#08222b; --accent:#f2b63a; --accent-ink:#2b1d00;
  --ok:#6fd39d; --ok-bg:#163428; --warn:#f0c062; --warn-bg:#3a2d10; --bad:#ff8a80; --bad-bg:#3d1b19; --info:#8cc4ea; --info-bg:#16303f; --mute-bg:#1f3038; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --surface:#14232a; --surface-2:#1b2e36; --line:#2a414b; --ink:#e4ecef; --ink-2:#a9bbc2; --ink-3:#7c9099;
  --brand:#7cc4d8; --brand-ink:#08222b; --accent:#f2b63a; --accent-ink:#2b1d00;
  --ok:#6fd39d; --ok-bg:#163428; --warn:#f0c062; --warn-bg:#3a2d10; --bad:#ff8a80; --bad-bg:#3d1b19; --info:#8cc4ea; --info-bg:#16303f; --mute-bg:#1f3038; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark svg{flex:none}
.mark b{font:700 18px/1.1 var(--f-display);letter-spacing:.02em}
.mark small{display:block;font-size:12px;opacity:.8}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{font:600 14px var(--f-display);letter-spacing:.03em;text-transform:uppercase;background:transparent;color:inherit;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;opacity:.85}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);opacity:1}
nav.tabs button:hover{opacity:1;border-color:currentColor}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:600;letter-spacing:.01em}
.eyebrow{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--ink-2)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font:700 34px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi.alert{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.bar-row{display:grid;grid-template-columns:170px minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--brand);border-radius:6px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar-row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stackbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--ink-2);font:12px var(--f-body)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Envoyé{color:var(--info);background:var(--info-bg)}
.st-Accepté{color:var(--warn);background:var(--warn-bg)}
.st-Inspecté{color:var(--brand);background:var(--surface-2)}
.st-Clôturé{color:var(--ok);background:var(--ok-bg)}
.st-Rejeté{color:var(--bad);background:var(--bad-bg)}
.c-Envoyé{background:var(--info)}.c-Accepté{background:var(--accent)}.c-Inspecté{background:var(--brand)}.c-Clôturé{background:var(--ok)}.c-Rejeté{background:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid .span2{grid-column:span 2}.form-grid .span3{grid-column:1/-1}
.btn{font:600 14px var(--f-display);letter-spacing:.03em;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.reg{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
table.reg th{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
table.reg td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg tr.r{cursor:pointer}
table.reg tr.r:hover td{background:var(--surface-2)}
table.reg td.cb,table.reg th.cb{width:36px;text-align:center}
.cards{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.selbar{position:sticky;bottom:0;z-index:15;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.selbar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.selbar select{width:auto;background:var(--surface)}
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:6px 12px 6px 0}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px}
.step.done{color:var(--ink)}.step.done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.cur{color:var(--ink)}.step.cur .dot{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step + .step::before{content:"";width:18px;height:2px;background:var(--line);margin-right:4px}
.checklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.ck:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 13px var(--f-display);letter-spacing:.04em;padding:8px 14px;border:0;background:var(--surface);color:var(--ink-2);cursor:pointer;min-width:48px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].C,.seg button[aria-pressed="true"].Accepté{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].NC,.seg button[aria-pressed="true"].Rejeté{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].NA,.seg button[aria-pressed="true"].Non-applicable{background:var(--ink-3);color:var(--surface)}
.pts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pts label{text-align:center}
.log{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.banner{border:1px solid var(--accent);background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.list-mini{display:flex;flex-direction:column}
.list-mini button{all:unset;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-mini button:focus-visible{outline:3px solid var(--accent)}
.list-mini button:last-child{border-bottom:0}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
@media (max-width:860px){
  .grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .form-grid .span2{grid-column:auto}
  .toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .toolbar .search{grid-column:1/-1}
  .bar-row{grid-template-columns:120px minmax(0,1fr) 34px}
  .pts{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:700px){ .tablewrap{display:none} .cards{display:flex;flex-direction:column;gap:10px} nav.tabs{margin-left:0;width:100%} nav.tabs button{flex:1;padding:7px 6px} .kpi .v{font-size:28px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <div class="wrap">
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 21h22M6 13h22" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="17" r="4.5" fill="var(--accent)"/></svg>

      <button id="nav-new" data-view="new">Nouveau RFI</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app">

</main>
<div class="toast" id="toast" hidden></div>

const todayISO = () => new Date().toISOString().slice(0,10);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const pill = s => `<span class="pill st-${esc(s)}">${esc(s)}</span>`;
const rowsArr = () => [...S.rows.values()].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || b.rfi.localeCompare(a.rfi));
const hasPV = r => !!(r.pv && r.pv.conclusion);

/* ---------- navigation ---------- */
function go(view, id){ S.view=view; if(id!==undefined) S.cur=id; render(); window.scrollTo(0,0); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.view)));

/* ---------- rendu ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===S.view || (S.view==="detail" && b.dataset.view==="reg") ? "page":"false"));
  const app=$("#app");
  if(!S.loaded){ app.innerHTML = `<div class="empty">${db===null && S.noDb ? "La base de données n'est pas disponible dans cette vue. Ouvrez la plateforme depuis claude.ai, connecté à votre compte." : "Chargement du registre…"}</div>`; return; }
  if(S.view==="dash") app.innerHTML=viewDash();
  else if(S.view==="reg") app.innerHTML=viewReg();
  else if(S.view==="detail") app.innerHTML=viewDetail();
  else if(S.view==="new") app.innerHTML=viewNew();
  bind();
}

function viewDash(){
  const rows=rowsArr();
  if(!rows.length) return `<div class="panel empty"><h2>Le registre est vide</h2><p>Créez le premier RFI avec l'onglet « Nouveau RFI ».</p></div>`;
  const ym=todayISO().slice(0,7);
  const month=rows.filter(r=>(r.date||"").startsWith(ym)).length;
  const noPV=rows.filter(r=>!hasPV(r) && r.statut!=="Rejeté");
  const acc=rows.filter(r=>r.pv&&r.pv.conclusion==="Accepté").length, rej=rows.filter(r=>r.statut==="Rejeté"||(r.pv&&r.pv.conclusion==="Rejeté")).length;
  const rate = (acc+rej)? Math.round(100*acc/(acc+rej))+" %" : "—";
  const byStat={}; ALL_STATUTS.forEach(s=>byStat[s]=0); rows.forEach(r=>byStat[r.statut]=(byStat[r.statut]||0)+1);
  const byType={}; rows.forEach(r=>byType[r.type]=(byType[r.type]||0)+1);
  const types=Object.entries(byType).sort((a,b)=>b[1]-a[1]); const maxT=Math.max(...types.map(t=>t[1]));
  // 12 derniers mois
  const months=[]; const d0=new Date(); d0.setDate(1);
  for(let i=11;i>=0;i--){ const d=new Date(d0.getFullYear(), d0.getMonth()-i, 1); months.push(d.toISOString().slice(0,7)); }
  const mCount=months.map(m=>rows.filter(r=>(r.date||"").startsWith(m)).length); const maxM=Math.max(1,...mCount);
  const W=560,H=200,pl=28,pb=26,bw=(W-pl)/12;
  const ticks=[0,Math.ceil(maxM/2),maxM];
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="RFI par mois">
    ${ticks.map(t=>{const y=H-pb-(H-pb-14)*t/maxM; return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t}</text>`;}).join("")}
    ${mCount.map((c,i)=>{const h=(H-pb-14)*c/maxM, x=pl+i*bw+bw*0.18, y=H-pb-h; const mm=months[i].slice(5); const lab=["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"][+mm-1];
      return `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${Math.max(h,0)}" rx="3" fill="${i===11?"var(--accent)":"var(--brand)"}"/>${c?`<text x="${x+bw*0.32}" y="${y-4}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${c}</text>`:""}<text x="${x+bw*0.32}" y="${H-8}" text-anchor="middle">${lab}</text>`;}).join("")}
  </svg>`;
  const total=rows.length;
  const todo=noPV.slice().sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).slice(0,8);
  return `<div class="stack">
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Situation au ${fmtD(todayISO())}</div><h1>Tableau de bord</h1></div>
      <button class="btn accent" data-go="new">+ Nouveau RFI</button></div>
    <div class="grid-kpi">
      <div class="kpi"><span class="v">${total}</span><span class="l">RFI au registre</span></div>
      <div class="kpi"><span class="v">${month}</span><span class="l">RFI ce mois-ci</span></div>
      <div class="kpi ${noPV.length?"alert":""}"><span class="v">${noPV.length}</span><span class="l">RFI sans PV clôturé</span></div>
      <div class="kpi"><span class="v">${rate}</span><span class="l">Taux d'acceptation des PV</span></div>
    </div>
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><h2>Avancement des RFI</h2><span class="muted" style="font-size:13px">${total} RFI</span></div>
      <div class="stackbar">${ALL_STATUTS.map(s=>byStat[s]?`<span class="c-${s}" style="width:${100*byStat[s]/total}%" title="${s} : ${byStat[s]}"></span>`:"").join("")}</div>
      <div class="legend">${ALL_STATUTS.map(s=>`<span><i class="c-${s}"></i>${s} <b>${byStat[s]||0}</b></span>`).join("")}</div>
    </div>
    <div class="grid-2">
      <div class="panel stack"><h2>RFI par type d'inspection</h2>
        <div class="stack" style="gap:8px">${types.map(([t,n])=>`<div class="bar-row"><span class="lab" title="${esc(t)}">${esc(t)}</span><span class="track"><span class="fill" style="display:block;width:${100*n/maxT}%"></span></span><span class="n">${n}</span></div>`).join("")}</div></div>
      <div class="panel stack"><h2>RFI par mois (12 derniers mois)</h2>${svg}</div>
    </div>
    <div class="panel stack"><div class="row" style="justify-content:space-between"><h2>À traiter en priorité</h2><button class="btn" data-go="reg" data-fstat="">Voir tout le registre</button></div>
      <p class="muted" style="margin:0;font-size:14px">Les RFI les plus anciens dont le PV n'est pas encore rempli.</p>
      <div class="list-mini">${todo.map(r=>`<button data-open="${esc(r.rfi)}"><span><span class="mono">${esc(r.rfi)}</span><br><span class="muted" style="font-size:13px">${esc(r.type)} · ${esc(r.ouvrage)} · ${fmtD(r.date)}</span></span>${pill(r.statut)}</button>`).join("") || `<p class="muted">Aucun RFI en attente.</p>`}</div>
    </div>
  </div>`;
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  return rowsArr().filter(r=>(!S.fType||r.type===S.fType)&&(!S.fStat||r.statut===S.fStat)&&(!S.fOuv||r.ouvrage===S.fOuv)&&
    (!q || [r.rfi,r.type,r.ouvrage,r.plan,r.designation,r.pk,r.rapport].join(" ").toLowerCase().includes(q)));
}

    : `<div class="panel empty">Aucun RFI ne correspond à ces filtres.</div>`}

function viewDetail(){
  const r=S.rows.get(S.cur);
  if(!r) return `<div class="panel empty">Ce RFI n'existe plus. <button class="btn" data-go="reg">Retour au registre</button></div>`;
  const f=formOf(r.type), pv=r.pv||{}, checks=pv.checks||{}, ro=S.canWrite?"":"disabled";
  const idx=STATUTS.indexOf(r.statut);
  const next = r.statut==="Rejeté"||r.statut==="Clôturé" ? null : STATUTS[idx+1];
  const steps = STATUTS.map((s,i)=>`<span class="step ${r.statut==="Rejeté"?"":i<idx?"done":i===idx?"cur":""}"><span class="dot">${i<idx&&r.statut!=="Rejeté"?"✓":i+1}</span>${s}</span>`).join("") + (r.statut==="Rejeté"?`<span class="step cur"><span class="dot" style="background:var(--bad);border-color:var(--bad);color:#fff">!</span>Rejeté</span>`:"");
  const field=(k,lab,cls="",type="text")=>`<label class="f ${cls}">${lab}<input id="f-${k}" type="${type}" value="${esc(r[k])}" ${ro}></label>`;
  const segBtns=(name,val,opts)=>`<span class="seg" role="group" aria-label="${esc(name)}">${opts.map(o=>`<button type="button" class="${o.replace(" ","-")}" aria-pressed="${val===o}" data-seg="${esc(name)}" data-val="${esc(o)}" ${ro}>${o}</button>`).join("")}</span>`;
  return `<div class="stack">
    <div><button class="btn" data-go="reg">← Registre</button></div>
    <div class="panel stack">
      <div class="detail-head"><div><div class="eyebrow">${esc(r.type)} · ${fmtD(r.date)}</div><h1 class="mono" style="font-family:var(--f-mono);font-size:22px">${esc(r.rfi)}</h1></div>${pill(r.statut)}</div>
      <div class="steps" aria-label="Étapes">${steps}</div>
      ${S.canWrite?`<div class="row">${next?`<button class="btn primary" id="advance" data-to="${next}">Passer à « ${next} »</button>`:""}
        ${r.statut!=="Rejeté"&&r.statut!=="Clôturé"?`<button class="btn danger" id="reject">Rejeter le RFI</button>`:""}
        ${r.statut==="Rejeté"||r.statut==="Clôturé"?`<button class="btn" id="reopen">Rouvrir (retour à « Inspecté »)</button>`:""}</div>`:`<div class="banner">Lecture seule : vous pouvez consulter et télécharger les PDF, mais pas modifier.</div>`}

    <div class="panel stack"><h2>Informations du RFI</h2>

        <label class="f">Type d'inspection<select id="f-type" ${ro}>${TYPES.map(t=>`<option ${t===r.type?"selected":""}>${esc(t)}</option>`).join("")}${TYPES.includes(r.type)?"":`<option selected>${esc(r.type)}</option>`}</select></label>
        ${field("date","Date d'inspection","","date")}${field("heure","Heure")}
        ${field("ouvrage","Ouvrage","span2")}${field("plan","Plan nº")}
        ${field("designation","Désignation","span3")}
        ${field("pk","PK / Localisation","span2")}${field("longueur","Longueur (ml)")}
        ${field("troncon","Tronçon N°")}${field("joints","Joints")}${field("discipline","Discipline")}
        ${field("lieu","Lieu (RFI) – vide = ouvrage","span2")}${field("item","Item ITP")}
        ${field("description","Description de l'inspection (RFI) – vide = désignation","span3")}
      </div>
      <div><div class="eyebrow" style="margin-bottom:6px">Points d'intervention (ITP)</div>
        <div class="pts">${["cst","qci","c1","ca","tpi1","tpi2"].map(k=>`<label class="f">${k.toUpperCase()}<select id="p-${k}" ${ro}>${["","P","W","H","R","-"].map(o=>`<option ${((r.points||{})[k]||"")===o?"selected":""}>${o}</option>`).join("")}</select></label>`).join("")}</div></div>
    </div>
    <div class="panel stack"><div class="row" style="justify-content:space-between"><h2>${esc(f.title)}</h2><span class="muted mono" style="font-size:13px">${esc(f.code)}</span></div>
      <div class="form-grid"><label class="f">N° de rapport (PV)<input id="pv-rapport" value="${esc(pv.rapport||r.rapport)}" ${ro}></label><label class="f">Date du PV<input id="pv-date" type="date" value="${esc(pv.date||"")}" ${ro}></label></div>
      <div class="checklist">${f.items.map((it,i)=>`<div class="ck"><span>${esc(it)}</span>${segBtns("ck"+i,checks["ck"+i]||"",["C","NC","NA"])}</div>`).join("")}</div>
      <div class="row"><span class="eyebrow">Conclusion de l'inspection</span>${segBtns("conclusion",pv.conclusion||"",["Accepté","Rejeté","Non applicable"])}</div>
      <label class="f">Remarques<textarea id="pv-rem" ${ro}>${esc(pv.remarques||r.remarques||"")}</textarea></label>

}

/* ---------- événements ---------- */
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation(); if(b.dataset.fstat!==undefined) S.fStat=b.dataset.fstat; go(b.dataset.go);}));
  document.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",e=>{ if(e.target.matches("input[type=checkbox]")) return; go("detail", el.dataset.open); }));
  document.querySelectorAll("[data-sel]").forEach(c=>c.addEventListener("change",()=>{ c.checked?S.sel.add(c.dataset.sel):S.sel.delete(c.dataset.sel); render(); }));
  const sa=$("#selAll"); if(sa) sa.addEventListener("change",()=>{ filtered().forEach(r=> sa.checked?S.sel.add(r.rfi):S.sel.delete(r.rfi)); render(); });
  const q=$("#q"); if(q){ q.addEventListener("input",()=>{ S.q=q.value; clearTimeout(bind.t); bind.t=setTimeout(()=>{ render(); const n=$("#q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); }); }
  ["fType","fStat","fOuv"].forEach(k=>{ const el=$("#"+k); if(el) el.addEventListener("change",()=>{ S[k]=el.value; render(); }); });
  const c=$("#clrSel"); if(c) c.addEventListener("click",()=>{ S.sel.clear(); render(); });
  const sp=$("#pdfSelPV"); if(sp) sp.addEventListener("click",()=>pdfGroup("PV"));
  const sr=$("#pdfSelRFI"); if(sr) sr.addEventListener("click",()=>pdfGroup("RFI"));
  // fiche
  document.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>{ const grp=b.parentElement; const was=b.getAttribute("aria-pressed")==="true";
    grp.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false")); if(!was) b.setAttribute("aria-pressed","true"); }));
  const sv=$("#save"); if(sv) sv.addEventListener("click",()=>saveDetail());
  const adv=$("#advance"); if(adv) adv.addEventListener("click",()=>saveDetail(adv.dataset.to));
  const rj=$("#reject"); if(rj) rj.addEventListener("click",()=>saveDetail("Rejeté"));
  const ro=$("#reopen"); if(ro) ro.addEventListener("click",()=>saveDetail("Inspecté"));
  const pr=$("#pdfRFI"); if(pr) pr.addEventListener("click",()=>{ const r=collect(); savePdf([r],"RFI",`RFI_${r.rfi}.pdf`); });
  const pp=$("#pdfPV"); if(pp) pp.addEventListener("click",()=>{ const r=collect(); savePdf([r],"PV",`PV_${r.rfi}.pdf`); });
  const nf=$("#newForm"); if(nf) nf.addEventListener("submit",e=>{ e.preventDefault(); createRfi(); });
}

/* lit la fiche affichée (sans écrire) */
function collect(){
  const r=JSON.parse(JSON.stringify(S.rows.get(S.cur)));
  if(!$("#f-ouvrage")) return r;
  ["date","heure","ouvrage","plan","designation","pk","longueur","troncon","joints","discipline","lieu","item","description"].forEach(k=>{ const el=$("#f-"+k); if(el) r[k]=el.value.trim(); });
  r.type=$("#f-type").value;
  r.points={}; ["cst","qci","c1","ca","tpi1","tpi2"].forEach(k=>r.points[k]=$("#p-"+k).value);
  const seg=n=>{ const b=document.querySelector(`[data-seg="${n}"][aria-pressed="true"]`); return b?b.dataset.val:""; };
  const checks={}; formOf(r.type).items.forEach((_,i)=>{ const v=seg("ck"+i); if(v) checks["ck"+i]=v; });
  r.pv={ rapport:$("#pv-rapport").value.trim(), date:$("#pv-date").value, checks, conclusion:seg("conclusion"), remarques:$("#pv-rem").value.trim() };
  return r;
}

let saving=false;
async function saveDetail(toStatus){
  if(saving||!db) return; saving=true;
  try{
    const r=collect(); const old=S.rows.get(S.cur); const msgs=[];
    if(toStatus){ r.statut=toStatus; msgs.push(`Statut : ${old.statut} → ${toStatus}`); }
    if(r.pv.conclusion && r.pv.conclusion!==(old.pv||{}).conclusion) msgs.push(`Conclusion du PV : ${r.pv.conclusion}`);
    if(toStatus==="Clôturé" && !r.pv.conclusion){ toast("Choisissez la conclusion du PV avant de clôturer."); return; }
    if(!msgs.length) msgs.push("Fiche modifiée");
    const log=(old.log||[]).concat(msgs.map(m=>({at:new Date().toISOString(),msg:m,by:S.me||""}))).slice(-40);
    const {rfi,...body}=r;
    await db.collection("rfi").doc(old.rfi).set({...body, rfi:old.rfi, log, updatedAt:new Date().toISOString(), updatedBy:S.me||""});
    toast(toStatus?`Statut : ${toStatus}`:"Enregistré");
  }catch(e){ writeFailed(e); } finally{ saving=false; }
}
async function createRfi(){
  if(!db) return;
  const v=k=>$("#n-"+k).value.trim();
  const id=v("rfi");
  if(!/^[A-Za-z0-9_.~:@+\-]{1,200}$/.test(id)){ toast("N° RFI : lettres, chiffres et tirets uniquement."); return; }
  if(S.rows.has(id)){ toast("Ce N° de RFI existe déjà dans le registre."); return; }
  const doc={ rfi:id, type:v("type"), date:v("date"), heure:v("heure"), discipline:v("discipline"), ouvrage:v("ouvrage"), plan:v("plan"), designation:v("designation"),
    pk:v("pk"), longueur:v("longueur"), troncon:"", joints:"", lieu:"", item:"", description:"", rapport:"", remarques:"",
    points:{cst:"",qci:"",c1:"",ca:"",tpi1:"",tpi2:""}, statut:"Envoyé", pv:{}, log:[{at:new Date().toISOString(),msg:"RFI créé",by:S.me||""}], updatedAt:new Date().toISOString(), updatedBy:S.me||"" };
  try{ await db.collection("rfi").doc(id).set(doc); toast("RFI créé"); go("detail", id); }catch(e){ writeFailed(e); }
}
function writeFailed(e){
  if(e && e.code==="invalid_argument"){ S.canWrite=false; render(); toast("Modification refusée : vous avez un accès en lecture seule."); }
  else if(e && e.code==="quota_exceeded") toast("Base pleine : supprimez des RFI anciens avant d'en ajouter.");
  else toast("Échec de l'enregistrement. Réessayez dans un instant.");
}

/* ---------- PDF (jsPDF) ---------- */
const clean = s => String(s??"").replace(/Ⅱ/g,"II").replace(/[≥]/g,">=").replace(/[’]/g,"'").replace(/[–—]/g,"-");
function pdfHeader(doc, r, kind){
  const f=formOf(r.type); const M=12, Wd=186;
  doc.setLineWidth(.3); doc.setDrawColor(0);
  doc.rect(M,10,Wd,24); doc.line(M+30,10,M+30,34); doc.line(M+Wd-46,10,M+Wd-46,34);
  doc.line(M+Wd-46,18,M+Wd,18); doc.line(M+Wd-46,26,M+Wd,26);
  try{ doc.addImage(LOGO_GTFT,"JPEG",M+2,15,11,12.5); doc.addImage(LOGO_GTP,"PNG",M+15,16,13,9.6); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
  const title = kind==="RFI"||f.long ? TITRE_LONG : TITRE_COURT;
  doc.text(doc.splitTextToSize(clean(title),Wd-80), M+30+(Wd-76)/2, 18.5, {align:"center"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8);
  const code = kind==="RFI" ? "21063-G0-QAQC-QC-0001" : (f.code||"");
  const date = kind==="RFI" ? "13/05/2025" : (f.date||"");
  doc.text(code, M+Wd-44, 15.5); doc.text("Date : "+date, M+Wd-44, 23.5); doc.text("Page 1/1", M+Wd-44, 31.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.rect(M,34,Wd,9); doc.text(clean(kind==="RFI"?"Demande d'inspection (RFI)":f.title), 105, 40, {align:"center"});
  return 43;
}
function cell(doc,x,y,w,h,txt,o={}){ doc.rect(x,y,w,h); if(txt===undefined||txt==="") return;
  doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.size||9.5);
  const lines=doc.splitTextToSize(clean(txt), w-4); const lh=(o.size||9.5)*0.42;
  const ty = o.top ? y+4.5 : y + h/2 - (lines.length-1)*lh/2 + 1.2;
  doc.text(lines, o.center? x+w/2 : x+2, ty, o.center?{align:"center"}:{}); }
function box(doc,x,y,on){ doc.rect(x,y-3,3.2,3.2); if(on){ doc.setLineWidth(.5); doc.line(x+.5,y-2.5,x+2.7,y-.3); doc.line(x+2.7,y-2.5,x+.5,y-.3); doc.setLineWidth(.3);} }
function approb(doc,y){ const M=12; const c=[M,M+34,M+72,M+110,M+148,M+186];
  cell(doc,M,y,34,12,"APPROBATION",{bold:true,center:true,size:9}); cell(doc,c[1],y,76,6,"C3",{bold:true,center:true,size:9});
  cell(doc,c[1],y+6,38,6,"CST",{bold:true,center:true,size:8.5}); cell(doc,c[2],y+6,38,6,"QCI",{bold:true,center:true,size:8.5});
  cell(doc,c[3],y,38,12,"C1",{bold:true,center:true,size:9}); cell(doc,c[4],y,38,12,"CA",{bold:true,center:true,size:9});
  [["Nom",8],["Signature",14],["Date",8]].reduce((yy,[l,h])=>{ cell(doc,M,yy,34,h,l,{size:8.5}); for(let i=1;i<5;i++) cell(doc,c[i],yy,38,h,""); return yy+h; }, y+12);
}
function drawPV(doc,r){
  const M=12, Wd=186, f=formOf(r.type), pv=r.pv||{}, ck=pv.checks||{};
  let y=pdfHeader(doc,r,"PV");
  [["Ouvrages",r.ouvrage,true],["Plan nº",r.plan],["Désignation",r.designation]].forEach(([l,v,b])=>{ cell(doc,M,y,34,9,l); cell(doc,M+34,y,Wd-34,9,v,{bold:b}); y+=9; });
  cell(doc,M,y,34,9,"Rapport nº"); cell(doc,M+34,y,40,9,pv.rapport||r.rapport); cell(doc,M+74,y,62,9,"DI/ (RFI) nº"); cell(doc,M+136,y,50,9,r.rfi,{bold:true,size:9}); y+=9;
  const tr=["Tronçon n° : "+(r.troncon||""), r.joints?"Joints : "+r.joints:"", r.pk?"PK : "+r.pk:""].filter(Boolean).join("   ");
  cell(doc,M,y,Wd-46,9,tr,{bold:true,size:9}); cell(doc,M+Wd-46,y,46,9,"Long : "+(r.longueur?r.longueur+" ml":"")); y+=9;
  cell(doc,M,y,Wd-46,8,"Inspection",{bold:true}); cell(doc,M+Wd-46,y,46,8,"Jugement",{bold:true,center:true}); y+=8;
  f.items.forEach((it,i)=>{ const v=ck["ck"+i]||""; const lines=doc.splitTextToSize(clean(it),Wd-50); const h=Math.max(9,lines.length*4.6+3);
    cell(doc,M,y,Wd-46,h,it); doc.rect(M+Wd-46,y,46,h); doc.setFont("helvetica","normal"); doc.setFontSize(9);
    const yy=y+h/2+1.5; box(doc,M+Wd-42,yy,v==="C"); doc.text("C",M+Wd-37.5,yy); box(doc,M+Wd-29,yy,v==="NC"); doc.text("NC",M+Wd-24.5,yy); box(doc,M+Wd-14,yy,v==="NA"); doc.text("NA",M+Wd-9.5,yy); y+=h; });
  const remH=Math.max(30, 222 - y);
  doc.rect(M,y,Wd,remH); doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.text("Remarques :",M+2,y+5);
  doc.setFont("helvetica","normal"); doc.text(doc.splitTextToSize(clean(pv.remarques||r.remarques||""),Wd-30),M+26,y+5); y+=remH;
  cell(doc,M,y,34,11,"Conclusion de l'inspection",{bold:true,size:8.5}); doc.rect(M+34,y,Wd-34,11);
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); const yc=y+7;
  [["Non applicable",M+48],["Accepté",M+105],["Rejeté",M+150]].forEach(([l,x])=>{ doc.text(l,x,yc); box(doc,x+doc.getTextWidth(l)+3,yc,pv.conclusion===l); });
  y+=11; approb(doc,y);
}
function drawRFI(doc,r){
  const M=12, Wd=186; let y=pdfHeader(doc,r,"RFI");
  cell(doc,M,y,120,9,"Discipline : "+(r.discipline||"PPL"),{bold:true}); cell(doc,M+120,y,66,9,"RFI No : "+r.rfi,{bold:true,size:9}); y+=9;
  cell(doc,M,y,Wd,9,"Date d'inspection : "+fmtD(r.date),{bold:true}); y+=9;
  cell(doc,M,y,Wd,11,"Lieu : "+(r.lieu||[r.ouvrage,r.pk].filter(Boolean).join(" ")),{bold:true,size:9}); y+=11;
  cell(doc,M,y,34,16,"Heure de réception",{bold:true,center:true,size:9}); cell(doc,M+34,y,76,8,"CPECC QA/QC",{bold:true,size:9}); cell(doc,M+110,y,76,8,"GTFT QA/QC",{bold:true,size:9});
  cell(doc,M+34,y+8,76,8,"Nom/Date :",{size:9}); cell(doc,M+110,y+8,76,8,"Nom/Date :",{size:9}); y+=16;
  const cw=[18,18,72,13,13,13,13,13,13]; const xs=cw.reduce((a,w)=>(a.push(a[a.length-1]+w),a),[M]);
  cell(doc,xs[0],y,18,18,"Item No.",{bold:true,center:true,size:8.5}); cell(doc,xs[1],y,18,18,"Heure",{bold:true,center:true,size:8.5}); cell(doc,xs[2],y,72,18,"Description de l'inspection",{bold:true,center:true,size:9});
  cell(doc,xs[3],y,78,6,"Point d'inspection",{bold:true,center:true,size:8.5}); cell(doc,xs[3],y+6,26,6,"C3",{bold:true,center:true,size:8});
  cell(doc,xs[3],y+12,13,6,"CST",{bold:true,center:true,size:7.5}); cell(doc,xs[4],y+12,13,6,"QCI",{bold:true,center:true,size:7.5});
  ["C1","CA","TPI1","TPI2"].forEach((l,i)=>cell(doc,xs[5+i],y+6,13,12,l,{bold:true,center:true,size:8})); y+=18;
  const p=r.points||{}; const h=16;
  cell(doc,xs[0],y,18,h,r.item,{center:true}); cell(doc,xs[1],y,18,h,r.heure,{center:true}); cell(doc,xs[2],y,72,h,r.description||r.designation,{size:8.5});
  ["cst","qci","c1","ca","tpi1","tpi2"].forEach((k,i)=>cell(doc,xs[3+i],y,13,h,p[k]||"",{center:true,bold:true})); y+=h;
  cell(doc,M,y,Wd,9,"CONCLUSION DE L'INSPECTION",{bold:true,center:true,size:10.5}); y+=9;
  cell(doc,M,y,24,8,"PV No.",{bold:true}); cell(doc,M+24,y,Wd-24,8,(r.pv&&r.pv.rapport)||r.rapport?`${r.type} - Rapport nº ${(r.pv&&r.pv.rapport)||r.rapport}`:""); y+=8;
  const c=(r.pv||{}).conclusion; doc.rect(M,y,Wd,9); doc.setFont("helvetica","bold"); doc.setFontSize(9.5);
  [["Approuvé",M+4,c==="Accepté"],["Approuvé avec commentaires",M+66,false],["Rejeté",M+150,c==="Rejeté"]].forEach(([l,x,on])=>{ box(doc,x,y+6,on); doc.text(l,x+6,y+6); }); y+=9;
  const remH=Math.max(30, 240-y); cell(doc,M,y,Wd,remH,"",{}); doc.setFont("helvetica","bold"); doc.text("Remarques :",M+2,y+5);
  doc.setFont("helvetica","normal"); doc.text(doc.splitTextToSize(clean((r.pv||{}).remarques||r.remarques||""),Wd-30),M+26,y+5); y+=remH;
  approb(doc,y);
}
async function savePdf(list, kind, filename){
  if(!window.jspdf){ toast("Le module PDF n'a pas pu se charger. Rechargez la page."); return; }
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  list.forEach((r,i)=>{ if(i) doc.addPage(); kind==="PV"?drawPV(doc,r):drawRFI(doc,r); });
  const blob=doc.output("blob");
  if(!dl){ toast("Le téléchargement n'est pas disponible dans cette vue."); return; }
  try{ await dl.save({filename:clean(filename).replace(/[^\w.\-]+/g,"_"), data:blob}); toast("PDF prêt"); }
  catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited") toast("Un téléchargement est déjà en cours."); else toast("Le PDF n'a pas pu être enregistré."); }
}
function pdfGroup(kind){
  const list=rowsArr().filter(r=>S.sel.has(r.rfi)).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!list.length) return;
  savePdf(list, kind, `${kind}_groupe_${list.length}_fiches_${todayISO()}.pdf`);
}

/* ---------- démarrage ---------- */
render();
(async()=>{
  const [d,u,w]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  db=d; users=u; dl=w;
  if(!db){ S.noDb=true; render(); return; }
  if(users){ S.me=await users.id(); const c=await users.can("data.write"); if(c===false) S.canWrite=false; }
  db.collection("rfi").onSnapshot(snap=>{
    S.rows=new Map(snap.docs.map(d=>{ const x=d.data(); return [d.id,{...x,rfi:d.id,statut:x.statut||"Envoyé"}]; }));
    S.loaded=true;
    const ae=document.activeElement; const typing = ae && ae.matches && ae.matches("#app input:not([type=checkbox]):not(#q),#app textarea,#app select") && (S.view==="detail"||S.view==="new");
    if(!typing) render();
  }, err=>{ toast("Connexion à la base perdue. Rechargez la page."); });
})();
</script>
